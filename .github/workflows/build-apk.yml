name: Build Smart SIM Registration Browser APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-sim-browser-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=smart_sim_registration_browser --org=com.rgc.smartreg .
          fi

      - name: Apply AGP 9 legacy ProGuard compatibility workaround
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('android/gradle.properties')
          s = p.read_text() if p.exists() else ''
          key = 'android.r8.proguardAndroidTxt.disallowed'
          lines = [line for line in s.splitlines() if not line.strip().startswith(key + '=')]
          lines.append(key + '=false')
          p.write_text('\n'.join(lines) + '\n')
          print(f'Applied temporary AGP 9 compatibility flag in {p}')
          PYCODE

      - name: Configure Android manifest permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          for line in permissions:
              name = line.split('"')[1]
              if name not in s:
                  s = s.replace('<application', line + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-sim-registration-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
